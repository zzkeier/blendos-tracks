impl: 'https://github.com/zzkeier/blendos-tracks/raw/main'

track: 'blendos-base'

packages:
  - 'kdeconnect'
  - 'plasma-desktop'
  - 'bluedevil'
  - 'kwallet-pam'
  - 'dolphin'
  - 'kate'
  - 'plasma-pa'
  - 'plasma-nm'
  - 'plasma-workspace'
  - 'konsole'
  - 'sddm'
  - 'wl-clipboard'
  - 'linux-zen'

services:
  - 'sddm'

commands:
  - 'rm -f /usr/share/applications/Waydroid.desktop'
  - 'useradd -m sddm -s /bin/false'
  - 'usermod -aG video sddm'
  - 'systemctl enable sddm'
  - |
    cat << EOF > /usr/lib/sddm/sddm.conf.d/no-gnome-initial-setup.conf
    [Users]
    HideUsers=gnome-initial-setup
    EOF
